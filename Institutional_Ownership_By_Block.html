<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Institutional Ownership by Census Block — Davidson County</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="won-theme.css">
<style>
 html,body{height:100%;margin:0;font-family:'EB Garamond',Garamond,serif}
 body{display:flex;flex-direction:column}
 #map{flex:1;min-height:0}
 #won-header{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:14px;background:#1c458c;color:#fff;padding:0 18px;border-bottom:4px solid #f0af1e;box-sizing:border-box}
 #won-header .brand{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:-.2px}
 #won-header .brand small{display:block;font-size:9.5px;font-weight:700;color:#f0af1e;letter-spacing:2px}
 #won-header .htitle{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:#dbe6f5;margin-left:auto}
 .panel{position:absolute;z-index:1000;background:rgba(255,255,255,.96);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
 #filter{top:66px;left:12px;padding:10px 12px;max-width:250px}
 #filter .lab{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8a94a0;margin-bottom:5px}
 #filter .chips{display:flex;gap:5px;flex-wrap:wrap}
 .chip{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;border:1px solid #cdd6e3;background:#fff;color:#1c458c;padding:4px 9px;border-radius:14px;cursor:pointer}
 .chip.on{background:#1c458c;color:#fff;border-color:#1c458c}
 #legend{bottom:16px;left:12px;padding:11px 13px;font-size:12.5px}
 #legend h4{font-family:'Montserrat',sans-serif;font-size:11px;margin:0 0 6px;color:#1c458c;text-transform:uppercase;letter-spacing:.4px}
 #legend .row{display:flex;align-items:center;gap:7px;line-height:1.65}
 #legend i{width:16px;height:12px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.2)}
 #legend .hint{font-size:10.5px;color:#888;font-style:italic;margin-top:5px}
 #status{bottom:16px;right:12px;padding:6px 11px;font-size:12px;color:#20303f;font-family:'Montserrat',sans-serif;font-weight:600}
 .lp{font-family:'EB Garamond',serif;font-size:13px;max-width:250px}
 .lp b{font-family:'Montserrat',sans-serif;color:#1c458c;font-size:13px}
 .lp .rate{font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;color:#bd0026}
 .lp .g{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:5px 0;font-size:12px}
 .lp .g span:nth-child(odd){color:#8a94a0}
 .lp .ops{border-top:1px solid #eef0f3;margin-top:5px;padding-top:4px;font-size:11.5px}
 .lp .ops div{display:flex;justify-content:space-between}
</style></head><body>
<div id="won-header"><a class="brand" href="index.html">Who Owns Nashville?<small>WHO OWNS</small></a><div class="htitle">Institutional Ownership by Block</div></div>
<div id="map"></div>
<div class="panel" id="filter"><div class="lab">Operator</div><div class="chips" id="opchips"></div></div>
<div class="panel" id="legend"><h4 id="legtitle">Institutional share</h4><div id="legrows"></div><div class="hint">Only blocks with an institutional owner are drawn.</div></div>
<div class="panel" id="status">loading…</div>
<script>
var BR=[3,8,15,30,50],COL=['#ffffcc','#fed976','#feb24c','#fd8d3c','#f03b20','#bd0026'],LAB=['<3%','3–8%','8–15%','15–30%','30–50%','50%+'];
function color(v){var i=0;while(i<BR.length&&v>=BR[i])i++;return COL[i];}
document.getElementById('legrows').innerHTML=COL.map((c,i)=>'<div class="row"><i style="background:'+c+'"></i>'+LAB[i]+'</div>').join('');
var map=L.map('map',{center:[36.10,-86.68],zoom:11,preferCanvas:true});
var carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19}).addTo(map);
var aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:19});
L.control.layers({"CARTO Positron":carto,"Aerial":aerial},{},{position:'topright'}).addTo(map);
fetch('https://nataliebaldacci.github.io/SFR_Nashville/data/Davidson_County_Boundary.geojson').then(r=>r.json()).then(function(b){
  var f=(b.features||[]).filter(x=>x.properties&&x.properties.OBJECTID===4);
  L.geoJSON(f.length?{type:'FeatureCollection',features:f}:b,{style:{color:"#1a3a5c",weight:2,fillOpacity:0,dashArray:"4,4"}}).addTo(map);
}).catch(function(){});
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;');}
var OPS=['Progress Residential','American Homes 4 Rent','Amherst Residential','Tricon Residential','Normandy Group','Starwood','CRG / ECG','Regent Homes','Porchlight','ava madison','RSD Development'];
var sel='all',DATA=null,layer=null;
// metric per feature: all -> total inst share; operator -> that operator's share of the block's homes
function val(p){ if(sel==='all') return p.rate; var n=(p.ops&&p.ops[sel])||0; return p.res? Math.round(1000*n/p.res)/10 : 0; }
function popup(p){
  var opl=Object.keys(p.ops).sort((a,b)=>p.ops[b]-p.ops[a]).map(function(o){return '<div><span>'+esc(o)+'</span><span>'+p.ops[o]+'</span></div>';}).join('');
  return '<div class="lp"><b>Block '+esc(p.b)+'</b><br><span class="rate">'+p.rate+'%</span> institutional<div class="g">'+
    '<span>Homes</span><span>'+p.res+'</span><span>Institutional</span><span>'+p.inst+'</span>'+
    '<span>Inst. appraised</span><span>$'+Math.round(p.val/1e6*10)/10+'M</span></div>'+
    '<div class="ops">'+opl+'</div></div>';
}
function draw(){
  if(layer) map.removeLayer(layer);
  var shown=0;
  layer=L.geoJSON(DATA,{renderer:L.canvas(),
    filter:function(f){return sel==='all' || (f.properties.ops&&f.properties.ops[sel]);},
    style:function(f){var v=val(f.properties);shown++;return {color:'#fff',weight:.3,fillColor:color(v),fillOpacity:.82};},
    onEachFeature:function(f,l){l.on('click',function(){l.bindPopup(popup(f.properties),{maxWidth:270}).openPopup();});}
  }).addTo(map);
  document.getElementById('status').innerHTML=shown.toLocaleString()+' blocks'+(sel!=='all'?' · '+esc(sel):'');
  document.getElementById('legtitle').textContent=sel==='all'?'Institutional share':esc(sel)+' share';
}
fetch('institutional_by_block.geojson').then(r=>r.json()).then(function(gj){
  DATA=gj;
  document.getElementById('opchips').innerHTML='<span class="chip on" data-o="all">All operators</span>'+OPS.map(o=>'<span class="chip" data-o="'+esc(o)+'">'+esc(o.replace(' Residential','').replace(' Homes 4 Rent',' 4 Rent'))+'</span>').join('');
  document.querySelectorAll('#opchips .chip').forEach(c=>c.onclick=function(){sel=this.getAttribute('data-o');document.querySelectorAll('#opchips .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');draw();});
  draw();
}).catch(function(e){document.getElementById('status').textContent='load error: '+e;});
</script></body></html>
