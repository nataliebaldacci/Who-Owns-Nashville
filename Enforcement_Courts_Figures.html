.gval{font-size:11px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
details{margin:10px 0 0}
summary{font-size:11px;color:var(--muted);cursor:pointer;padding:3px 0}
table{border-collapse:collapse;margin-top:8px;font-size:11.5px;width:100%}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
