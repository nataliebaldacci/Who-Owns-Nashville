const map=L.map('map',{zoomControl:true}).setView([36.07,-86.62],14);
const AER='https://maps.nashville.gov/arcgis/rest/services/Imagery/';
let aerial=null;
function showYear(i){const y=YEARS[i];document.getElementById('yr').textContent=y;document.getElementById('rng').value=i;
  const nl=L.tileLayer(AER+SVC[y]+'/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Aerial: Metro Nashville '+y});
  nl.addTo(map); if(aerial){const old=aerial;setTimeout(()=>map.removeLayer(old),350);} aerial=nl;}
document.getElementById('rng').max=YEARS.length-1;
const doll=n=>n>0?'$'+n.toLocaleString():'';
// PARCELS
let parcelLayer=L.geoJSON(null,{style:f=>{const built=String(f.properties.st||'').indexOf('Current')>=0;
    return{color:built?'#ffd21e':'#00e0ff',weight:1.4,fillOpacity:0,opacity:0.95};},
  onEachFeature:(f,l)=>{const p=f.properties,A=p.apn,a=p.acq||{};
    let deed=a.url?'<br><b>Bought from:</b> '+(a.seller||'unknown')+(a.date?' on '+a.date:'')+(a.price>0?' for '+doll(a.price):'')+' <a href="'+a.url+'" target="_blank">deed &#8599;</a>':'';
    l.bindPopup('<div class="pp"><b>'+(p.op||'')+'</b><br>'+(p.st||'')+' &middot; '+(p.mo||'')+'<br>'+(p.own||'')+'<br>'+(p.addr||'')+' &middot; APN '+A+deed+
      '<div class="tk" style="margin-top:5px">'+
      '<a href="https://maps.nashville.gov/ParcelViewer/?parcelID='+A+'" target="_blank">Parcel Viewer</a>'+
      '<a href="https://davidson-tn-citizen.comper.info/template.aspx?propertyID='+A+'" target="_blank">Comper</a>'+
      '<a href="https://documents.nashville.gov/Request/Form/PermitCodes?parcelnumber='+A+'" target="_blank">Permit docs</a>'+
      '<a href="https://maps.nashville.gov/ParcelService/Search.asmx/GetPropertyHistory?onlyactive=false&pin='+A+'" target="_blank">Plat history</a></div></div>');}
});
fetch('BTR_Machine.geojson').then(r=>r.json()).then(g=>{parcelLayer.addData({type:'FeatureCollection',features:g.features.filter(f=>f.geometry&&String(f.geometry.type).indexOf('Polygon')>=0)});parcelLayer.addTo(map);});
// SUBDIVISION boundaries
let subLayer=L.geoJSON(null,{style:{color:'#ff2d95',weight:2.2,fill:false,opacity:0.95,dashArray:'5,3'},
  onEachFeature:(f,l)=>{const n=f.properties.NAME||'';l.bindTooltip(n,{permanent:false,direction:'center',className:'subtip'});l.bindPopup('<b>'+n+'</b><br>Recorded '+(f.properties.RECORDEDDATE?new Date(f.properties.RECORDEDDATE).toLocaleDateString():'')+'<br>Instrument '+(f.properties.INSTRUMENT||''));}});
fetch('Davidson_BTR_Subdivisions.geojson').then(r=>r.json()).then(g=>subLayer.addData(g).addTo(map));
// HOA common areas
let hoaLayer=L.geoJSON(null,{style:{color:'#2ecc40',weight:1.5,fillColor:'#2ecc40',fillOpacity:0.35,opacity:0.9},
  onEachFeature:(f,l)=>l.bindPopup('<b>HOA / common area</b><br>'+(f.properties.own||'')+'<br>'+(f.properties.addr||'')+' &middot; APN '+f.properties.apn)});
fetch('Davidson_BTR_HOAs.geojson').then(r=>r.json()).then(g=>hoaLayer.addData(g).addTo(map));
L.control.layers(null,{'Build-to-rent parcels':parcelLayer,'Subdivision boundaries':subLayer,'HOA / common areas':hoaLayer},{position:'topright',collapsed:false}).addTo(map);
// subdivision jump + info
const sel=document.getElementById('c');
SUBS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.label;sel.appendChild(o);});
function goSub(i){const s=SUBS[i];map.fitBounds([s.b[0],s.b[1]],{padding:[30,30],maxZoom:17});
  let h='<b>'+s.label+'</b>';
  if(s.hoa)h+='<br><span class="hoa">HOA / owner:</span> '+s.hoa;
  if(s.plats&&s.plats.length){h+='<br><b>Recorded plat chain</b> (deed image):';
    s.plats.forEach(p=>{h+='<div class="p">'+(p.date||'')+' &middot; <b>'+p.type+'</b>'+(p.acres&&p.acres!=='0'?' &middot; '+p.acres+' ac':'')+' &middot; '+(p.status||'')+' <a href="'+p.url+'" target="_blank">'+p.ins+' &#8599;</a></div>';});}
  h+='<div style="margin-top:5px;font-size:10.5px;color:#888">Click any parcel for its purchase deed (who they bought it from) and permit docs. Tell: HOA owner mailing to an operator address (e.g. Mountain Springs Owners Assn &rarr; 30601 Agoura Rd = AMH) = operator build-to-rent.</div>';
  document.getElementById('info').innerHTML=h;}
sel.addEventListener('change',e=>goSub(+e.target.value));
document.getElementById('rng').addEventListener('input',e=>showYear(+e.target.value));
let playing=null;
document.getElementById('play').addEventListener('click',function(){if(playing){clearInterval(playing);playing=null;this.innerHTML='&#9654; Play through the years';return;}
  this.innerHTML='&#10073;&#10073; Pause';let i=+document.getElementById('rng').value;if(i>=YEARS.length-1)i=0;
  playing=setInterval(()=>{if(i>=YEARS.length-1){clearInterval(playing);playing=null;document.getElementById('play').innerHTML='&#9654; Play through the years';return;}i++;showYear(i);},1400);});
showYear(YEARS.indexOf(2014)); goSub(0);
