<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Who Owns Nashville — Parcel Data Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1c458c;--gold:#f0af1e;--bd:#d6ddea;--ink:#20303f;--muted:#6b7683}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',Arial,sans-serif;color:var(--ink);background:#eef4fb;line-height:1.5}
  header{background:var(--navy);color:#fff;padding:26px 22px;border-bottom:5px solid var(--gold);text-align:center}
  header h1{margin:0;font-size:24px;font-weight:800}
  header p{margin:6px 0 0;font-size:13px;opacity:.9}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  #search{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;border:2px solid var(--bd);border-radius:8px;outline:none}
  #search:focus{border-color:var(--gold)}
  #status{font-size:12.5px;color:var(--muted);margin:8px 2px}
  #results{margin-top:8px}
  .hit{background:#fff;border:1px solid var(--bd);border-left:3px solid var(--gold);border-radius:6px;padding:9px 13px;margin:7px 0;cursor:pointer;font-size:13px}
  .hit:hover{background:#f5f8fd}
  .hit b{color:var(--navy)}
  .hit .sub{color:var(--muted);font-size:12px}
  .card{background:#fff;border:1px solid var(--bd);border-top:4px solid var(--gold);border-radius:8px;padding:18px 20px;margin:10px 0 20px;box-shadow:0 3px 10px rgba(28,69,140,.1)}
  .card h2{margin:0 0 3px;font-size:19px;color:var(--navy);font-weight:800}
  .card .addr{color:var(--muted);font-size:13px;margin-bottom:12px}
  .row{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:13px;padding:4px 0;border-bottom:1px solid #eef0f3}
  .row .k{color:var(--muted);font-weight:600}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--navy);font-weight:700;margin:14px 0 4px;border-bottom:1px solid var(--gold);padding-bottom:2px}
  .links a{display:inline-block;margin:8px 8px 0 0;background:var(--navy);color:#fff;text-decoration:none;padding:6px 11px;border-radius:5px;font-size:12px;font-weight:700}
  .links a:hover{background:var(--gold);color:var(--navy)}
  .back{color:var(--navy);cursor:pointer;font-size:13px;font-weight:700;display:inline-block;margin-bottom:8px}
</style></head><body>
<header>
  <h1>Parcel Data Explorer</h1>
  <p>Search every Davidson County parcel &middot; owner, deed history, assessment, zoning &amp; permits &middot; primary government data</p>
</header>
<div class="wrap">
  <input id="search" placeholder="Loading parcels…" disabled autocomplete="off"/>
  <div id="status">Loading the parcel database (one-time, ~18 MB)…</div>
  <div id="results"></div>
</div>
<script>
var DATA=[], READY=false;
var search=document.getElementById('search'), status=document.getElementById('status'), results=document.getElementById('results');
fetch('parcel_index.json').then(function(r){return r.json();}).then(function(d){
  DATA=d;
  for(var i=0;i<DATA.length;i++){var r=DATA[i];r._s=((r.o||'')+' '+(r.addr||'')+' '+(r.a||'')).toLowerCase();}
  READY=true;
  search.disabled=false; search.placeholder='Search by owner, address, or APN…'; search.focus();
  status.textContent=DATA.length.toLocaleString()+' parcels loaded. Type at least 3 characters.';
}).catch(function(e){status.textContent='Could not load parcel data: '+e;});

function esc(s){return (s==null?'':(''+s)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmt(v){return (v==null||v==='')?'&mdash;':esc(v);}
function money(v){return (v==null||v==='')?'&mdash;':'$'+Number(v).toLocaleString();}

var t;
search.addEventListener('input',function(){clearTimeout(t);t=setTimeout(run,180);});
function run(){
  if(!READY)return;
  var q=search.value.trim().toLowerCase();
  if(q.length<3){results.innerHTML='';status.textContent=DATA.length.toLocaleString()+' parcels loaded. Type at least 3 characters.';return;}
  var hits=[];
  for(var i=0;i<DATA.length && hits.length<60;i++){if(DATA[i]._s.indexOf(q)>-1){hits.push(DATA[i]);}}
  status.textContent=hits.length+(hits.length>=60?'+':'')+' matches';
  results.innerHTML=hits.map(function(r){
    return '<div class="hit" data-apn="'+esc(r.a)+'"><b>'+fmt(r.o)+'</b><br><span class="sub">'+fmt(r.addr)+' &middot; APN '+esc(r.a)+'</span></div>';
  }).join('');
  [].forEach.call(results.querySelectorAll('.hit'),function(el){el.onclick=function(){showCard(el.getAttribute('data-apn'));};});
}
function showCard(apn){
  var r=null;for(var i=0;i<DATA.length;i++){if(DATA[i].a===apn){r=DATA[i];break;}}
  if(!r)return;
  var pv='https://maps.nashville.gov/ParcelViewer/?parcel='+encodeURIComponent(apn);
  var pc='http://www.padctn.org/prc/#/search/'+encodeURIComponent(apn);
  var api='https://maps.nashville.gov/arcgis2/rest/services/Parcels/ParcelHistory/MapServer/2/query?where=APN=%27'+encodeURIComponent(apn)+'%27&outFields=*&f=json';
  var h='<span class="back" onclick="run()">&larr; back to results</span>'+
    '<div class="card"><h2>'+fmt(r.o)+'</h2><div class="addr">'+fmt(r.addr)+' &middot; APN '+esc(apn)+'</div>'+
    '<div class="sec">Ownership</div>'+
    '<div class="row"><span class="k">Current owner</span><span>'+fmt(r.o)+'</span></div>'+
    '<div class="row"><span class="k">Acquired</span><span>'+fmt(r.od)+'</span></div>'+
    '<div class="row"><span class="k">Owner mailing</span><span>'+fmt(r.oa)+'</span></div>'+
    '<div class="row"><span class="k">Prior owner</span><span>'+fmt(r.o2)+'</span></div>'+
    '<div class="row"><span class="k">Owner before that</span><span>'+fmt(r.o3)+'</span></div>'+
    '<div class="row"><span class="k">Total deed events</span><span>'+fmt(r.nt)+'</span></div>'+
    '<div class="sec">Assessment &amp; characteristics</div>'+
    '<div class="row"><span class="k">Land use / class</span><span>'+fmt(r.lu)+'</span></div>'+
    '<div class="row"><span class="k">Appraised value</span><span>'+money(r.av)+'</span></div>'+
    '<div class="row"><span class="k">Market value</span><span>'+money(r.mv)+'</span></div>'+
    '<div class="row"><span class="k">Property size</span><span>'+fmt(r.sf)+'</span></div>'+
    '<div class="sec">Zoning</div>'+
    '<div class="row"><span class="k">Zone</span><span>'+fmt(r.z)+(r.zd?' &middot; '+esc(r.zd):'')+'</span></div>'+
    '<div class="sec">Permits</div>'+
    '<div class="row"><span class="k">Total permits</span><span>'+fmt(r.np)+'</span></div>'+
    '<div class="row"><span class="k">Most recent</span><span>'+fmt(r.lp)+(r.lpd?' ('+esc(r.lpd)+')':'')+'</span></div>'+
    '<div class="links"><a target="_blank" href="'+pv+'">Parcel Viewer</a><a target="_blank" href="'+pc+'">Property Card</a>'+
    '<a target="_blank" href="'+api+'">Ownership API</a></div>'+
    '</div>';
  results.innerHTML=h;
  window.scrollTo(0,0);
}
</script></body></html>
