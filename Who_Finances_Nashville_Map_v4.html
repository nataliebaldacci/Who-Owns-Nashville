<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Who Finances Nashville? Securitized Homes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
 html,body{height:100%;margin:0;font-family:'EB Garamond',Garamond,serif}
 body{display:flex;flex-direction:column}
 #map{flex:1;min-height:0}
 #won-header{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:14px;background:#1c458c;color:#fff;padding:0 18px;border-bottom:4px solid #f0af1e;box-sizing:border-box}
 #won-header .brand{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:-.2px}
 #won-header .brand small{display:block;font-size:9.5px;font-weight:700;color:#f0af1e;letter-spacing:2px}
 #won-header .htitle{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:#dbe6f5;margin-left:auto}
 .panel{position:absolute;z-index:1000;background:rgba(255,255,255,.97);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
 #filters{top:66px;left:12px;padding:10px 12px;width:266px}
 .lab{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8a94a0;margin:2px 0 4px}
 #filters .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
 .chip{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;border:1px solid #cdd6e3;background:#fff;color:#1c458c;padding:5px 10px;border-radius:15px;cursor:pointer}
 .chip.on{background:#1c458c;color:#fff;border-color:#1c458c}
 .tourrow{display:flex;gap:6px;align-items:center;margin-bottom:7px}
 #tourBtn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;background:#f0af1e;color:#1c458c;border:0;border-radius:6px;padding:7px 11px;cursor:pointer}
 .navb{font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;background:#eef1f6;color:#1c458c;border:1px solid #d3dbe6;border-radius:6px;padding:6px 9px;cursor:pointer}
 #dealSel{width:100%;font-family:'EB Garamond',serif;font-size:13px;padding:6px 7px;border:1px solid #cdd6e3;border-radius:6px;background:#fff;color:#20303f;margin-bottom:7px}
 #clearBtn{width:100%;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;background:#fff;color:#d7263d;border:1px solid #f2b8c2;border-radius:6px;padding:6px;cursor:pointer}
 #clearBtn:hover{background:#fdeef0}
 #legend{bottom:214px;left:12px;padding:10px 12px;font-size:13px;width:236px}
 #legend .row{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;line-height:1.7;border-radius:4px;padding:1px 3px}
 #legend .row:hover{background:#f2f6fc}
 #legend .row.dim{opacity:.32}
 #legend .row.sel{background:#eef4ff;outline:1px solid #b9cdf0}
 #legend .sw{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.3)}
 #legend b{font-family:'Montserrat',sans-serif;font-size:12px}
 #legend .n{font-family:'Montserrat',sans-serif;font-weight:800;margin-left:auto;font-size:11.5px;color:#1c458c}
 #baseToggle{top:66px;right:10px;padding:6px 8px;display:flex;gap:5px;z-index:1001}
 /* right panel: deal list OR transactions table */
 #right{top:112px;right:10px;width:560px;max-height:calc(100% - 330px);overflow:auto;padding:10px 12px}
 #right h3{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;color:#1c458c;margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
 #dlist .o{display:flex;gap:7px;font-size:12.5px;padding:3px 4px;border-bottom:1px solid #eef0f3;cursor:pointer;border-radius:4px}
 #dlist .o:hover{background:#f2f6fc}
 #dlist .o.sel{background:#fdeef0;outline:1px solid #f2b8c2}
 #dlist .o .rk{color:#b9c2cf;font-family:'Montserrat',sans-serif;font-weight:700;width:16px}
 #dlist .o .nm{flex:1;line-height:1.15}
 #dlist .o .yr{font-family:'Montserrat',sans-serif;color:#8a94a0;font-size:10px}
 #dlist .o .ct{font-family:'Montserrat',sans-serif;font-weight:800;color:#1c458c}
 #dlist .o .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:4px}
 table.tx{width:100%;border-collapse:collapse;font-size:11.5px}
 table.tx th{font-family:'Montserrat',sans-serif;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#8a94a0;text-align:left;padding:4px 5px 4px 0;border-bottom:1.5px solid #20303f;white-space:nowrap}
 table.tx td{padding:5px 5px 5px 0;border-bottom:1px solid #eef0f3;vertical-align:top;line-height:1.25}
 table.tx tr:hover td{background:#f7faff}
 .ity{font-family:'Montserrat',sans-serif;font-weight:800;font-size:9px;padding:2px 6px;border-radius:9px;white-space:nowrap;display:inline-block}
 .ity.deed{background:#eaf2ff;color:#1c458c}
 .ity.dot{background:#fdf1d8;color:#8a6100}
 .ity.assn{background:#f0e6f7;color:#6b3fa0}
 .ity.sec{background:#e3f4ec;color:#1e7a48}
 td.dt{font-family:'Montserrat',sans-serif;font-size:10.5px;color:#66707c;white-space:nowrap}
 td.pty{max-width:112px;word-wrap:break-word;overflow-wrap:anywhere}
 td.extra{max-width:120px;font-size:10.5px;color:#66707c;overflow-wrap:anywhere}
 table.tx td:last-child,table.tx th:last-child{width:74px}
 table.tx td:last-child a{font-family:'Montserrat',sans-serif;font-size:9.5px;overflow-wrap:anywhere}
 .amt{font-family:'Montserrat',sans-serif;font-weight:700;color:#20303f;font-size:10.5px}
 /* bottom deal card */
 #bottombox{bottom:0;left:50%;transform:translateX(-50%);width:min(1080px,97%);border-radius:12px 12px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.28);padding:0;overflow:hidden;z-index:1001}
 #bb-summary{display:flex}
 #bb-summary .tile{padding:9px 18px;text-align:center;border-right:1px solid #e9ecf1;flex:1}
 #bb-summary .tile:last-child{border-right:none}
 #bb-summary .tile .v{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:#1c458c;font-variant-numeric:tabular-nums;line-height:1.15}
 #bb-summary .tile .l{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#8a94a0;margin-top:2px}
 #bb-deal{display:none}
 #bb-deal .top{display:flex;align-items:baseline;gap:14px;padding:10px 20px 9px;color:#fff}
 #bb-deal .top .dname{font-family:'Montserrat',sans-serif;font-weight:800;font-size:25px;line-height:1.05;letter-spacing:-.3px}
 #bb-deal .top .dsub{font-size:12px;opacity:.93;font-family:'Montserrat',sans-serif;font-weight:600}
 #bb-deal .top .close{margin-left:auto;cursor:pointer;font-size:21px;opacity:.85;font-family:sans-serif}
 #bb-deal .idrow{display:flex;background:#f7f9fc;border-bottom:1px solid #e9ecf1;font-size:12px}
 #bb-deal .idrow .f{padding:6px 16px;border-right:1px solid #e9ecf1;flex:1}
 #bb-deal .idrow .f:last-child{border-right:none}
 #bb-deal .idrow .f .k{font-family:'Montserrat',sans-serif;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#8a94a0}
 #bb-deal .idrow .f .v{font-weight:700;color:#20303f;font-size:12.5px;line-height:1.2}
 #bb-deal .stats{display:flex;background:#fff}
 #bb-deal .stats .tile{padding:8px 14px;text-align:center;border-right:1px solid #e9ecf1;flex:1}
 #bb-deal .stats .tile:last-child{border-right:none}
 #bb-deal .stats .tile .v{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:#1c458c;font-variant-numeric:tabular-nums}
 #bb-deal .stats .tile .l{font-family:'Montserrat',sans-serif;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#8a94a0;margin-top:2px}
 #bb-deal .foot{font-size:11.5px;color:#66707c;padding:7px 20px 9px;background:#fff;border-top:1px solid #e9ecf1;line-height:1.5}
 #bb-deal .foot b{color:#20303f}
 .up{color:#c0392b;font-weight:700}.dn{color:#1e7a48;font-weight:700}
 .acsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px}
 .acs .k{font-family:'Montserrat',sans-serif;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#8a94a0}
 .acs .v{font-size:12.5px;color:#20303f;font-weight:700;line-height:1.3}
 .acs .vs{color:#8a94a0;font-weight:400;font-size:11.5px}
 .acsnote{font-style:italic;color:#8a94a0;font-size:10.5px;margin-top:4px}
 /* property popup */
 .lp{font-family:'EB Garamond',serif;font-size:12.5px;max-width:340px}
 .lp .ph{width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:6px;background:#eef1f6;display:block}
 .lp .badge{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:800;font-size:10.5px;color:#fff;padding:3px 9px;border-radius:12px;margin-bottom:5px}
 .lp .addr{font-family:'Montserrat',sans-serif;font-weight:800;color:#20303f;font-size:14px;line-height:1.15}
 .lp .sub{color:#8a94a0;font-size:12px;margin-bottom:5px}
 .lp .sect{font-family:'Montserrat',sans-serif;font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#1c458c;margin:7px 0 3px;border-top:1px solid #e9ecf1;padding-top:6px}
 .lp .sect.deal{color:#d7263d}
 .lp .g{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
 .lp .g span:nth-child(odd){color:#8a94a0}
 .lp .g b{font-weight:700;color:#20303f}
 .lp .otype{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10px;padding:1px 7px;border-radius:10px;background:#eef4ff;color:#1c458c}
 .lp .links{font-size:11.5px;margin-top:6px;line-height:1.7}
 .lp a{color:#1c458c}
 details.hx{margin-top:5px;border-top:1px solid #e9ecf1;padding-top:4px}
 details.hx summary{font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;color:#1c458c;cursor:pointer;list-style:none;padding:2px 0}
 details.hx summary::-webkit-details-marker{display:none}
 details.hx summary:before{content:"\25B8 ";color:#8a94a0}
 details.hx[open] summary:before{content:"\25BE "}
 details.hx table{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:3px}
 details.hx th{font-family:'Montserrat',sans-serif;font-size:8px;text-transform:uppercase;color:#8a94a0;text-align:left;border-bottom:1px solid #d8dee7;padding:2px 4px 2px 0}
 details.hx td{padding:2px 4px 2px 0;border-bottom:1px solid #f2f4f7;vertical-align:top}
 .leaflet-popup-content{margin:11px 13px}
 .homeMarker{background:none;border:none}
 .homeMarker svg{filter:drop-shadow(0 .5px .5px rgba(0,0,0,.35))}
</style></head><body>
<div id="won-header"><a class="brand" href="#">Who Owns Nashville?<small>WHO FINANCES</small></a><div class="htitle">Securitized Single-Family Homes &middot; Davidson County</div></div>
<div id="map"></div>

<div class="panel" id="filters">
  <div class="tourrow"><button id="tourBtn">&#9654; Tour deals</button><button class="navb" id="prevBtn">&#9664;</button><button class="navb" id="nextBtn">&#9654;</button></div>
  <select id="dealSel"><option value="">Filter by deal name&hellip;</option></select>
  <div class="lab">Loan era</div>
  <div class="chips" id="eraChips">
    <span class="chip on" data-era="all">All</span><span class="chip" data-era="e1">2013-16</span><span class="chip" data-era="e2">2017-19</span><span class="chip" data-era="e3">2020-22</span><span class="chip" data-era="e4">2023+</span>
  </div>
  <button id="clearBtn">&#10005; Clear all filters</button>
</div>

<div class="panel" id="legend"><div class="lab">Operator &middot; click to highlight</div><div id="legrows"></div></div>
<div class="panel" id="baseToggle"><span class="chip on" data-base="gray">Gray</span><span class="chip" data-base="aerial">Aerial</span><span class="chip" data-base="streets">Streets</span></div>

<div class="panel" id="right">
  <h3 id="right-h">Securitization deals</h3>
  <div id="dlist"></div>
  <div id="txwrap" style="display:none"></div>
</div>

<div class="panel" id="bottombox">
  <div id="bb-summary">loading&hellip;</div>
  <div id="bb-deal">
    <div class="top" id="bb-top">
      <div><div class="dname" id="bb-name"></div><div class="dsub" id="bb-sub"></div></div>
      <div class="close" onclick="clearDeal()">&times;</div>
    </div>
    <div class="idrow" id="bb-id"></div>
    <div class="stats" id="bb-stats"></div>
    <div class="foot" id="bb-foot"></div>
  </div>
</div>

<script>
/* Amherst is tested before AMH everywhere: the string "amherst" contains "amh". */
var OPS={Progress:{c:'#c0392b',l:'Progress / Pretium'},AMH:{c:'#1c458c',l:'American Homes 4 Rent'},
 Amherst:{c:'#f0af1e',l:'Amherst'},Blackstone:{c:'#8e44ad',l:'Blackstone / Tricon'},
 Starwood:{c:'#e67e22',l:'Starwood'},Cerberus:{c:'#00838f',l:'Cerberus / FirstKey'},Other:{c:'#9aa0a6',l:'Other'}};
function brandOf(op){var o=String(op||'').toLowerCase();
 if(o.indexOf('pretium')>=0||o.indexOf('progress')>=0)return 'Progress';
 if(o.indexOf('amherst')>=0||o.indexOf('main street')>=0)return 'Amherst';
 if(o.indexOf('amh')>=0)return 'AMH';
 if(o.indexOf('blackstone')>=0||o.indexOf('home partners')>=0||o.indexOf('tricon')>=0)return 'Blackstone';
 if(o.indexOf('starwood')>=0)return 'Starwood';
 if(o.indexOf('cerberus')>=0||o.indexOf('firstkey')>=0)return 'Cerberus';
 return 'Other';}
var eraF='all',opF=null,isolate=null,DATA=null,CARDS={},CUR={},ALLOC={},DEALS=[],dealOrder=[],dealPos=-1;
function opcol(br){return (OPS[br]||{}).c||'#9aa0a6';}
function houseSVG(f){return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='13' height='13'><path d='M12 3 L21 11 L18.5 11 L18.5 20 L14 20 L14 14 L10 14 L10 20 L5.5 20 L5.5 11 L3 11 Z' fill='"+f+"' stroke='rgba(0,0,0,.5)' stroke-width='1.4'/></svg>";}
var _ic={};
function houseIcon(c){if(!_ic[c])_ic[c]=L.divIcon({html:houseSVG(c),className:'homeMarker',iconSize:[13,13],iconAnchor:[6,10],popupAnchor:[0,-9]});return _ic[c];}
function era(y){y=+y||0;if(y<=2016)return 'e1';if(y<=2019)return 'e2';if(y<=2022)return 'e3';return 'e4';}
function median(a){if(!a.length)return null;a=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;');}
function na(v){return (v==null||v==='')?'n/a':esc(v);}
function money(v){if(v==null||v==='')return 'n/a';if(typeof v==='string'&&v.charAt(0)==='$')return v;
 var n=Number(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?'n/a':'$'+Math.round(n).toLocaleString();}
function big(v){if(v==null)return 'n/a';v=+v;
 if(v>=1e9)return '$'+(v/1e9).toFixed(2)+'B';
 if(v>=1e6)return '$'+(v/1e6).toFixed(1)+'M';
 return '$'+Math.round(v).toLocaleString();}
function titlecase(s){return String(s||'').toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();});}
function monthYear(d){if(!d)return 'n/a';
 var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
 var m=/^(\d{4})-(\d{2})/.exec(d);
 if(m)return M[+m[2]-1]+' '+m[1];
 m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(d);
 if(m){var y=+m[3];if(y<100)y+=2000;return M[+m[1]-1]+' '+y;}
 return esc(d);}
/* ACS shares arrive as 0-100, not 0-1. Do not rescale. */
function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'\u2026':s;}
function pct(v){return v==null?'n/a':(+v).toFixed(1)+'%';}

var map=L.map('map',{center:[36.13,-86.72],zoom:10,preferCanvas:true});
var carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap, &copy; CARTO',maxZoom:19}).addTo(map);
var osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19});
var aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri, Maxar',maxZoom:19});
var BASES={gray:carto,streets:osm,aerial:aerial};
function setBase(k){Object.keys(BASES).forEach(function(b){if(map.hasLayer(BASES[b]))map.removeLayer(BASES[b]);});BASES[k].addTo(map);}
map.createPane('mask');var _mp=map.getPane('mask');_mp.style.zIndex=350;_mp.style.pointerEvents='none';
fetch('Davidson_County_Boundary.geojson').then(r=>r.json()).then(function(b){
 var f=(b.features||[]).filter(x=>x.properties&&x.properties.OBJECTID===4);var feat=f.length?f[0]:(b.features||[])[0];if(!feat)return;
 L.geoJSON(feat,{style:{color:"#1a3a5c",weight:2,fillOpacity:0,dashArray:"4,4"},interactive:false}).addTo(map);
 var outer=[[85,-180],[85,180],[-85,180],[-85,-180]];
 var polys=feat.geometry.type==='Polygon'?[feat.geometry.coordinates]:feat.geometry.coordinates;
 var holes=polys.map(function(pl){return pl[0].map(function(c){return [c[1],c[0]];});});
 L.polygon([outer].concat(holes),{pane:'mask',stroke:false,fillColor:'#e9edf1',fillOpacity:.85,interactive:false}).addTo(map);
}).catch(function(){});

// ---------- ParcelHistory: lazy per-parcel history, fetched on open ----------
var PH='https://maps.nashville.gov/arcgis2/rest/services/Parcels/ParcelHistory/MapServer/';
function phQuery(layer,keyField,val){
 return fetch(PH+layer+'/query?where='+encodeURIComponent(keyField+"='"+val+"'")+'&outFields=*&returnGeometry=false&f=json')
  .then(function(r){return r.json();}).then(function(j){return (j.features||[]).map(function(f){return f.attributes;});});
}
function phQueryNum(layer,keyField,val){
 return fetch(PH+layer+'/query?where='+encodeURIComponent(keyField+'='+val)+'&outFields=*&returnGeometry=false&f=json')
  .then(function(r){return r.json();}).then(function(j){return (j.features||[]).map(function(f){return f.attributes;});});
}
function dstr(ms){if(ms==null||ms==='')return '';var d=new Date(+ms);return isNaN(d)?String(ms):(d.getUTCMonth()+1)+'/'+d.getUTCDate()+'/'+d.getUTCFullYear();}
function instLink(inst){var d=String(inst||'').replace(/\D/g,'');
 return d.length>=12?'<a target="_blank" href="https://davidsonportal.com/gis/file.php?file='+d+'">'+esc(inst)+'</a>':esc(inst||'');}
function tbl(head,rows){
 if(!rows.length)return '<div style="color:#8a94a0;font-size:11px;padding:3px 0">No records.</div>';
 return '<table><tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+
  rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';
}
// each dropdown loads once, on first open
function wireHistory(el,p){
 el.querySelectorAll('details.hx').forEach(function(d){
  d.addEventListener('toggle',function(){
   if(!d.open||d.dataset.loaded)return;
   d.dataset.loaded='1';
   var body=d.querySelector('.hxbody');body.innerHTML='<div style="color:#8a94a0;font-size:11px">Loading&hellip;</div>';
   var kind=d.dataset.kind,pid=p.pid,apn=p.apn;
   var job;
   if(kind==='owner') job=phQueryNum(2,'parcelid',pid).then(function(rs){
     rs.sort(function(a,b){return (b.sortdate||0)-(a.sortdate||0);});
     return tbl(['Owner','Acquired','Instrument','Mailing','Amount','Status'],rs.map(function(a){
      return [esc(a.name),dstr(a.DateAcquired),instLink(a.Instrument),
              esc([a.address1,a.city,a.StateCode,a.PostalCode].filter(Boolean).join(', ')),
              a.SalePrice?money(a.SalePrice):'',esc(a.Status||'')];}));});
   else if(kind==='prop') job=phQueryNum(3,'parcelid',pid).then(function(rs){
     rs.sort(function(a,b){return (b.sortdate||0)-(a.sortdate||0);});
     return tbl(['Address','Legal','Instrument','Effective','Acres','Status'],rs.map(function(a){
      return [esc(a.FullAddress),esc((a.LegalDescription||'').slice(0,44)),instLink(a.Instrument),
              dstr(a.DateEffective),a.Acres?(+a.Acres).toFixed(2):'',esc(a.Status||'')];}));});
   else if(kind==='zone') job=phQueryNum(5,'ParcelID',pid).then(function(rs){
     rs.sort(function(a,b){return (b.sortdate||0)-(a.sortdate||0);});
     return tbl(['Zone','Description','Effective','Ordinance','Status'],rs.map(function(a){
      return [esc(a.ZoneCode),esc(a.Description||''),dstr(a.DateEffective),esc(a.OrdinanceNumber||''),esc(a.Status||'')];}));});
   else if(kind==='asmt') job=phQueryNum(6,'parcelid',pid).then(function(rs){
     rs.sort(function(a,b){return (b.sortdate||0)-(a.sortdate||0);});
     return tbl(['Effective','Class','Land','Improved','Total'],rs.map(function(a){
      return [dstr(a.DateEffective),esc(a.CLASS||''),money(a.LAND_APPR_VAL),money(a.IMP_APPR_VAL),
              '<b>'+money(a.TOTL_APPR_VAL)+'</b>'];}));});
   else if(kind==='permit') job=phQuery(4,'APN',apn).then(function(rs){
     rs.sort(function(a,b){return (b.DATE_ISSUED||0)-(a.DATE_ISSUED||0);});
     return tbl(['Case','Type','Issued','Value','Scope'],rs.map(function(a){
      var u=a.epermits||('https://epermits.nashville.gov/#/permit/'+encodeURIComponent(a.CASE_NUMBER||''));
      return ['<a target="_blank" href="'+esc(u)+'">'+esc(a.CASE_NUMBER||'')+'</a>',esc(a.CASE_TYPE_DESC||a.CASE_TYPE||''),
              dstr(a.DATE_ISSUED),a.CONSTVAL?money(a.CONSTVAL):'',esc((a.SCOPE||'').slice(0,40))];}));});
   else job=Promise.resolve('');
   job.then(function(html){body.innerHTML=html;})
      .catch(function(e){body.innerHTML='<div style="color:#c0392b;font-size:11px">Could not load: '+esc(e.message||e)+'</div>';});
  });
 });
}

// ---------- property popup ----------
function structLabel(p){var s=String(p.struct||'').toUpperCase();
 if(s.indexOf('CONDO')>=0)return 'Residential Condo';
 if(s.indexOf('SINGLE')>=0)return 'Single Family';
 return p.struct?titlecase(p.struct):'n/a';}
function popup(p){
 var apn=esc(String(p.apn||'')),dig=String(p.inst||'').replace(/\D/g,''),c=opcol(brandOf(p.op||p.br));
 var img='https://image-cdn.spatialest.com/image/tn-davidson-images/med/Images/'+apn+'_1.jpg';
 var h='<div class="lp">';
 h+='<img class="ph" src="'+img+'" alt="" onerror="this.style.display=\'none\'"/>';
 h+='<span class="badge" style="background:'+c+'">'+esc(p.own)+'</span>';
 h+='<div class="addr">'+na(p.addr)+'</div>';
 h+='<div class="sub">'+na(p.city)+(p.city?', TN ':'TN ')+na(p.zip)+'</div>';
 h+='<div class="sect">Current parcel record</div><div class="g">'
   +'<span>APN</span><b>'+na(p.apn)+'</b>'
   +'<span>Year built</span><b>'+na(p.yrblt)+'</b>'
   +'<span>Structure type</span><b>'+structLabel(p)+'</b>'
   +'<span>Assessment class</span><b>'+na(p['class'])+'</b>'
   +'<span>Current zoning</span><b>'+na(p.czone)+'</b>'
   +'<span>Finished sq ft</span><b>'+(p.sqft?esc(p.sqft):'n/a')+'</b>'
   +'<span>Beds / baths</span><b>'+(p.beds?(parseFloat(p.beds)+' bd'):'n/a')+' / '+(p.baths?(parseFloat(p.baths)+' ba'):'n/a')+'</b>'
   +'<span>2025 appraised</span><b>'+money(CUR[String(p.pid)])+'</b>'
   +'<span>Current owner</span><b>'+na(p.cowner)+'</b>'
   +'<span>Ownership type</span><b><span class="otype">'+na(p.otype||'Other')+'</span></b>'
   +'<span>Date acquired</span><b>'+na(p.cacq)+'</b>'
   +'<span>Purchase price</span><b>'+money(p.cprice)+'</b>'
   +'</div>';
 h+='<div class="sect deal">As of the securitization ('+na(p.acq)+')</div><div class="g">'
   +'<span>Owner as of deal</span><b>'+na(p.d_owner||p.own)+'</b>'
   +'<span>Year purchased</span><b>'+na(p.d_year||p.acq)+'</b>'
   +'<span>Purchase price</span><b>'+money(ALLOC[String(p.pid)])+'</b>'
   +'<span>Recorded deed total</span><b>'+money(p.d_price)+' <span style="color:#8a94a0;font-weight:400">(all properties in the deed)</span></b>'
   +'<span>Appraised at deal</span><b>'+money(p.appr)+'</b>'
   +'<span>Zoning at deal</span><b>'+na(p.d_zone||p.czone)+'</b>'
   +'<span>Class at deal</span><b>'+na(p.d_class||p['class'])+'</b>'
   +'<span>Property type</span><b>'+(p.d_type?titlecase(p.d_type):structLabel(p))+'</b>'
   +'</div>';
 // full link toolkit
 var tk=[];
 if(p.apn)tk.push('<a target="_blank" href="https://maps.nashville.gov/ParcelViewer/?parcelID='+apn+'">Parcel Viewer</a>');
 if(p.pid)tk.push('<a target="_blank" href="https://maps.nashville.gov/ParcelViewer/PrintRecord.html?pin='+esc(p.pid)+'">Parcel Report</a>');
 if(dig.length>=12)tk.push('<a target="_blank" href="https://davidsonportal.com/gis/file.php?file='+dig+'">Deed image</a>');
 if(p.lat&&p.lon){
   tk.push('<a target="_blank" href="https://www.google.com/maps?q&layer=c&cbll='+p.lat+','+p.lon+'">Street View</a>');
   tk.push('<a target="_blank" href="https://portal.patriotproperties.com/?APIKEY=5D050659143EB96630FB38B91DE12E40&LAT='+p.lat+'&LONG='+p.lon+'">Aerial</a>');
 }
 if(p.pid)tk.push('<a target="_blank" href="https://maps.nashville.gov/ParcelService/Search.asmx/GetGenInfo?ParcelID='+esc(p.pid)+'">Parcel info (API)</a>');
 h+='<div class="links">'+tk.join(' &middot; ')+'</div>';
 // history dropdowns, loaded on demand from the ParcelHistory service
 [['owner','Owner history'],['prop','Property history'],['zone','Zoning history'],
  ['asmt','Assessment history'],['permit','Building permits']].forEach(function(x){
  h+='<details class="hx" data-kind="'+x[0]+'"><summary>'+x[1]+'</summary><div class="hxbody"></div></details>';
 });
 return h+'</div>';
}

// ---------- filtering ----------
function baseKeep(p){if(eraF!=='all'&&era(p.acq)!==eraF)return false;if(opF&&brandOf(p.op||p.br)!==opF)return false;return true;}
function mapKeep(p){if(isolate)return p.own===isolate;return baseKeep(p);}
var layer=L.geoJSON(null,{
 pointToLayer:function(f,ll){return L.marker(ll,{icon:houseIcon(opcol(brandOf(f.properties.op||f.properties.br)))});},
 filter:function(f){return mapKeep(f.properties);},
 onEachFeature:function(f,l){l.on('click',function(e){
  // Select the deal FIRST: refresh() rebuilds the marker layer, which would destroy a
  // marker-bound popup. Open the popup on the map afterwards so it survives the rebuild.
  selectDeal(f.properties.own,false);
  openParcel(f.properties,e.latlng||l.getLatLng());
 });}}).addTo(map);
function openParcel(p,ll){
 L.popup({maxWidth:360,minWidth:320,autoPan:true,keepInView:true})
  .setLatLng(ll).setContent(popup(p)).openOn(map);
 var el=document.querySelector('.leaflet-popup-content .lp');
 if(el)wireHistory(el,p);
}

// ---------- deal registry ----------
function buildDeals(){
 var m={};
 DATA.features.forEach(function(f){var p=f.properties;
  var d=m[p.own]||(m[p.own]={nm:p.own,br:brandOf(p.op||p.br),op:p.op,n:0,years:[],appr:[]});
  d.n++;if(p.acq)d.years.push(+p.acq);
  if(p.appr){var a=(''+p.appr).replace(/[^0-9.]/g,'');if(a)d.appr.push(+a);}});
 DEALS=Object.keys(m).map(function(k){var d=m[k];d.year=d.years.length?median(d.years):null;
  var c=CARDS[k];d.deal=c?c.deal:k;return d;});
 DEALS.sort(function(a,b){return b.n-a.n;});
 dealOrder=DEALS.map(function(d){return d.nm;});
 document.getElementById('dealSel').innerHTML='<option value="">Filter by deal name&hellip;</option>'+
  DEALS.map(function(d){return '<option value="'+esc(d.nm)+'">'+esc(d.deal)+'  ('+(d.year||'n/a')+', '+d.n+' home'+(d.n===1?'':'s')+')</option>';}).join('');
}

// ---------- selection ----------
function selectDeal(nm,zoom){isolate=nm;opF=null;dealPos=dealOrder.indexOf(nm);
 document.getElementById('dealSel').value=nm;refresh();
 if(zoom){try{var b=layer.getBounds();if(b.isValid())map.fitBounds(b.pad(0.25),{maxZoom:15});}catch(e){}}}
function clearDeal(){isolate=null;dealPos=-1;document.getElementById('dealSel').value='';stopTour();refresh();}
function pickOp(k){opF=(opF===k)?null:k;isolate=null;dealPos=-1;document.getElementById('dealSel').value='';stopTour();refresh();}
function clearAll(){eraF='all';opF=null;isolate=null;dealPos=-1;stopTour();
 document.getElementById('dealSel').value='';
 document.querySelectorAll('#eraChips .chip').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-era')==='all');});
 refresh();try{var b=layer.getBounds();if(b.isValid())map.fitBounds(b.pad(0.05));}catch(e){}}

// ---------- transactions and people ----------
function ityClass(t){t=String(t||'').toUpperCase();
 if(t.indexOf('SEC')>=0||t.indexOf('ABS-15G')>=0)return 'sec';
 if(t.indexOf('ASSN')>=0||t.indexOf('AMEND')>=0||t.indexOf('MODAGR')>=0)return 'assn';
 if(t.indexOf('DOT')>=0)return 'dot';return 'deed';}
function ityLabel(t){t=String(t||'').trim();
 var M={'DOT':'Deed of Trust','DOTASSN':'DOT Assignment','DOTAMEND':'DOT Amendment','DOTMODAGR':'DOT Modification',
  'DEEDQC':'Quit Claim Deed','DEEDWARR':'Warranty Deed','DEEDWARRSP':'Special Warranty Deed',
  'LIENMISC':'Lien (HOA)','REL':'Lien Release'};
 return M[t.toUpperCase()]||t;}
function renderTx(card){
 var tx=(card&&card.tx)||[];
 if(!tx.length)return '<div style="color:#8a94a0;font-size:12px">No recorded instruments matched this deal.</div>';
 var rows=tx.map(function(t){
  var amt=t.amount?('<div class="amt">'+big(t.amount)+(t.n?' &middot; '+t.n+' props':'')+'</div>'):'';
  return '<tr>'
   +'<td><span class="ity '+ityClass(t.type)+'">'+esc(ityLabel(t.type))+'</span>'+amt+'</td>'
   +'<td class="dt">'+esc(t.date||'')+'</td>'
   +'<td class="pty">'+esc(t.grantor||'')+'</td>'
   +'<td class="pty">'+esc(t.grantee||'')+'</td>'
   +'<td class="extra" title="'+esc(t.extra||'')+'">'+esc(shorten(t.extra,58))+'</td>'
   +'<td class="dt">'+(t.url?'<a target="_blank" href="'+esc(t.url)+'">'+esc(t.inst||'view')+'</a>':esc(t.inst||''))+'</td>'
   +'</tr>';}).join('');
 return '<table class="tx"><tr><th>Instrument type</th><th>Date</th><th>Grantor / party</th><th>Grantee</th>'
  +'<th>Extra people</th><th>Filing no.</th></tr>'+rows+'</table>';
}

// ---------- bottom deal card ----------
function renderBottom(){
 var summ=document.getElementById('bb-summary'),cardEl=document.getElementById('bb-deal');
 var listEl=document.getElementById('dlist'),txEl=document.getElementById('txwrap'),hEl=document.getElementById('right-h');
 if(isolate){
  var c=CARDS[isolate]||{},d=dealByName(isolate)||{},col=opcol(c.brand||d.br);
  summ.style.display='none';cardEl.style.display='block';
  document.getElementById('bb-top').style.background=col;
  document.getElementById('bb-name').textContent=c.deal||isolate;
  document.getElementById('bb-sub').textContent=isolate;
  var idf=[['Sponsor',c.sponsor||'n/a'],['Ultimate parent',c.parent||'n/a'],
           ['Deal size',big(c.size)],['Closed (approx.)',monthYear(c.closing)]];
  document.getElementById('bb-id').innerHTML=idf.map(function(f){
   return '<div class="f"><div class="k">'+f[0]+'</div><div class="v">'+esc(f[1])+'</div></div>';}).join('');
  var then=c.appr_then,now=c.appr_now,chg=(then&&now)?(now/then-1):null;
  var tiles=[['Nashville properties',(c.parcels||d.n||0).toLocaleString()],
             ['Appraised at deal',big(then)],
             ['Appraised now',big(now)+(chg==null?'':' <span class="'+(chg>=0?'up':'dn')+'">'+(chg>=0?'+':'')+Math.round(chg*100)+'%</span>')],
             ['Census tracts',c.tracts||0],
             ['ZIP codes',(c.zips||[]).length]];
  document.getElementById('bb-stats').innerHTML=tiles.map(function(t){
   return '<div class="tile"><div class="v">'+t[1]+'</div><div class="l">'+t[0]+'</div></div>';}).join('');
  // ACS: these neighborhoods against Davidson County, vintage-matched to the deal year
  var cs=c.census||{},cells=[];
  function cmp(lbl,key,fmt){var v=cs[key];if(!v||v[0]==null||v[1]==null)return;
   var a=v[0],b=v[1],r=b?(a/b):null;
   cells.push('<div class="acs"><div class="k">'+lbl+'</div>'
    +'<div class="v">'+fmt(a)+' <span class="vs">vs '+fmt(b)+'</span>'
    +(r?' <span class="'+(r>=1?'up':'dn')+'">'+(r>=1?'+':'')+Math.round((r-1)*100)+'%</span>':'')
    +'</div></div>');}
  cmp('Median home value','home_value',big);
  cmp('Median household income','hh_income',big);
  cmp('Median gross rent','gross_rent',big);
  cmp('Renter share','renter_share',pct);
  cmp('Owner-occupied share','owner_share',pct);
  cmp('Poverty rate','poverty',pct);
  cmp('Renter cost burden','cost_burden',pct);
  var vint=(c.acs_vintage||[]).length?(' ACS '+c.acs_vintage.join('/')+' 5-year, matched to the deal year.'):'';
  var acs=cells.length?('<div class="acsgrid">'+cells.join('')+'</div>'
    +'<div class="acsnote">Each figure is the median across the tracts holding this deal\'s homes, against the typical Davidson tract.'+vint+'</div>'):'';
  var states=(c.states||[]).filter(function(s){return s!=='TN';});
  var sline=states.length?('This deal also pledged homes in <b>'+states.length+'</b> other states: '+states.join(', ')
    +(c.sched_n?'. The full schedule lists <b>'+c.sched_n.toLocaleString()+'</b> properties nationally, of which <b>'+(c.parcels||0)+'</b> are in Davidson.':'.'))
    :'No other states disclosed in this deal\'s SEC schedule.';
  var zl=(c.zips||[]).length?('<b>ZIPs:</b> '+c.zips.join(', ')+'. '):'';
  document.getElementById('bb-foot').innerHTML=acs+'<div style="margin-top:5px">'+zl+sline+'</div>';
  // right panel becomes the transactions table
  hEl.textContent='Table of relevant transactions and people';
  listEl.style.display='none';txEl.style.display='block';txEl.innerHTML=renderTx(c);
 }else{
  cardEl.style.display='none';summ.style.display='flex';
  hEl.textContent='Securitization deals';listEl.style.display='block';txEl.style.display='none';
  var vis=[],appr=[],yrs=[],rent=[],deal={};
  DATA.features.forEach(function(fe){var p=fe.properties;if(!mapKeep(p))return;
   vis.push(1);
   if(p.appr){var a=(''+p.appr).replace(/[^0-9.]/g,'');if(a)appr.push(+a);}
   if(p.acq)yrs.push(2026-p.acq);
   if(p.fmr3)rent.push(p.fmr3);
   deal[p.own]=1;});
  var mA=median(appr),mY=median(yrs),mR=median(rent);
  var tiles=[['Homes',vis.length.toLocaleString()],['Deals',Object.keys(deal).length.toLocaleString()],
   ['Median appraisal at deal',mA==null?'n/a':'$'+Math.round(mA).toLocaleString()],
   ['Median yrs held',mY==null?'n/a':Math.round(mY)],
   ['Median 3BR FMR',mR==null?'n/a':'$'+Math.round(mR).toLocaleString()]];
  summ.innerHTML=tiles.map(function(t){return '<div class="tile"><div class="v">'+t[1]+'</div><div class="l">'+t[0]+'</div></div>';}).join('');
 }
}
function dealByName(nm){for(var i=0;i<DEALS.length;i++)if(DEALS[i].nm===nm)return DEALS[i];return null;}

function refresh(){
 layer.clearLayers();layer.addData(DATA);
 var cc={};Object.keys(OPS).forEach(function(k){cc[k]=0;});
 DATA.features.forEach(function(f){var p=f.properties;
  var ok=(eraF==='all'||era(p.acq)===eraF)&&(!isolate||p.own===isolate);
  if(ok){var b=brandOf(p.op||p.br);cc[b]=(cc[b]||0)+1;}});
 document.getElementById('legrows').innerHTML=Object.keys(OPS).map(function(k){
  var cls=opF?(opF===k?' sel':' dim'):'';
  return '<div class="row'+cls+'" data-k="'+k+'"><span class="sw" style="background:'+OPS[k].c+'"></span><b>'+OPS[k].l+'</b><span class="n">'+(cc[k]||0).toLocaleString()+'</span></div>';}).join('');
 document.querySelectorAll('#legrows .row').forEach(function(row){row.onclick=function(){pickOp(row.getAttribute('data-k'));};});
 var lb=DEALS.filter(function(d){return eraF==='all'||era(d.year)===eraF;});
 document.getElementById('dlist').innerHTML=lb.map(function(o,i){var c=opcol(o.br);
  return '<div class="o'+(o.nm===isolate?' sel':'')+'" data-nm="'+esc(o.nm)+'" title="'+esc(o.nm)+'"><span class="rk">'+(i+1)+'</span><span class="dot" style="background:'+c+'"></span><span class="nm">'+esc(o.deal)+'<br><span class="yr">'+(o.year||'n/a')+'</span></span><span class="ct">'+o.n+'</span></div>';}).join('');
 document.querySelectorAll('#dlist .o').forEach(function(row){row.onclick=function(){selectDeal(this.getAttribute('data-nm'),true);};});
 renderBottom();
}

// ---------- tour ----------
var T=null;
function stopTour(){if(T){clearInterval(T);T=null;document.getElementById('tourBtn').innerHTML='&#9654; Tour deals';}}
function step(dir){if(!dealOrder.length)return;dealPos=(dealPos+dir+dealOrder.length)%dealOrder.length;selectDeal(dealOrder[dealPos],true);}
document.getElementById('tourBtn').onclick=function(){if(T){stopTour();return;}this.innerHTML='&#10073;&#10073; Pause';step(1);T=setInterval(function(){step(1);},4200);};
document.getElementById('prevBtn').onclick=function(){stopTour();step(-1);};
document.getElementById('nextBtn').onclick=function(){stopTour();step(1);};
document.getElementById('dealSel').onchange=function(){var v=this.value;if(v)selectDeal(v,true);else clearDeal();};
document.getElementById('clearBtn').onclick=clearAll;
document.querySelectorAll('#eraChips .chip').forEach(function(ch){ch.onclick=function(){
 eraF=this.getAttribute('data-era');
 document.querySelectorAll('#eraChips .chip').forEach(function(x){x.classList.remove('on');});
 this.classList.add('on');isolate=null;dealPos=-1;document.getElementById('dealSel').value='';refresh();};});
document.querySelectorAll('#baseToggle .chip').forEach(function(ch){ch.onclick=function(){
 setBase(this.getAttribute('data-base'));
 document.querySelectorAll('#baseToggle .chip').forEach(function(x){x.classList.remove('on');});
 this.classList.add('on');};});

Promise.all([
 fetch('securitized_homes.geojson').then(function(r){return r.json();}),
 fetch('deal_cards.json').then(function(r){return r.json();}).catch(function(){return {deals:{},cur2025:{},alloc:{}};})
]).then(function(res){
 DATA=res[0];CARDS=res[1].deals||res[1];CUR=res[1].cur2025||{};ALLOC=res[1].alloc||{};buildDeals();refresh();
 try{var b=layer.getBounds();if(b.isValid())map.fitBounds(b.pad(0.05));}catch(e){}
}).catch(function(e){document.getElementById('bb-summary').textContent='load error: '+e;});
</script></body></html>
