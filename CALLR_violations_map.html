const map=L.map('map',{center:[36.166,-86.784],zoom:10});
const positron=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:20}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19});
const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri',maxZoom:19});
L.control.layers({'CARTO Positron':positron,'OpenStreetMap':osm,'Aerial (Esri)':aerial},null,{position:'topright',collapsed:false}).addTo(map);
// Davidson County boundary (OBJECTID=4), navy dashed
fetch('Davidson_County_Boundary.geojson').then(r=>r.json()).then(d=>{
  L.geoJSON(d,{filter:f=>f.properties.OBJECTID===4,style:{color:'#1a3a5c',weight:2.0,fillOpacity:0,dashArray:'4,4'},interactive:false}).addTo(map);
}).catch(()=>{});
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const pts=L.geoJSON(DATA,{
  pointToLayer:(f,ll)=>{const inst=f.properties.institutional===true;return L.circleMarker(ll,{radius:7,color:'#fff',weight:1.2,fillColor:inst?'#D93A4C':'#1c458c',fillOpacity:.85});},
  onEachFeature:(f,layer)=>{
    const p=f.properties, apn=esc(p.apn), c=f.geometry.coordinates, lat=c[1], lng=c[0];
    const tk=[
      ['Parcel Viewer','https://maps.nashville.gov/ParcelViewer/?parcelID='+apn],
      ['Comper','https://maps.nashville.gov/Comper/?parcelID='+apn],
      ['Aerial','https://maps.nashville.gov/ParcelViewer/?parcelID='+apn+'&basemap=aerial'],
      ['Street View','https://www.google.com/maps?q&layer=c&cbll='+lat+','+lng],
      ['ePermits case','https://epermits.nashville.gov/#/permit/'+esc(p.caseNumber)],
      ['Land Records','https://www.davidsonportal.com/']
    ].map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+' &#8599;</a>').join(' &middot; ');
    layer.bindPopup('<b>'+esc(p.caseNumber)+'</b><br><b>'+esc(p.address)+'</b><br>'+esc(p.city)+' '+esc(p.zip)+
      '<br><b>Owner:</b> '+esc(p.owner)+'<br><b>APN:</b> '+apn+'<br><b>Status:</b> '+esc(p.status)+
      '<br><b>Modified:</b> '+esc((p.modified||'').slice(0,10))+(p.institutional?'<br><b style="color:#D93A4C">Institutional owner</b>':'')+
      '<div class="tk">'+tk+'</div>',{maxWidth:380});
  }
}).addTo(map);
map.fitBounds(pts.getBounds().pad(0.15));
document.getElementById('status').textContent=DATA.features.length+' violation cases';
