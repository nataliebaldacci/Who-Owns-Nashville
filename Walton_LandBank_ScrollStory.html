  html:`<div class="card wide" style="border-top-color:var(--rust)"><div class="kicker"><span class="era">A decade of land banking</span></div>
   <h1>Who land-banks Nashville?</h1>
   <p>A subdivision in Nolensville was drawn on paper in <b>2007</b>. The houses did not get built until <b>2017</b>. In between sat a recession, three banks, and a land investor from Arizona.</p>
   <p class="small">This is the story of Carothers Crossing, rebuilt entirely from Metro's own deed, plat, and parcel records. Scroll to follow the ground from farmland to $700k rooftops.</p></div>`},

   <h2>The recession bust</h2>
   <p>The 2008 crash froze the project before a single house went up. Wood Ridge defaulted, and the platted-but-empty lots fell to its lenders.</p>

   <h2>Farmland &rarr; plat &rarr; bust &rarr; land bank &rarr; rooftops</h2>
   <p>Wood Ridge drew it in 2007. Three banks held it through the bust. Walton bought the wreckage for <b>$12.2M</b> in 2014 and sold it to Regent in 2016. The rebuilt child parcels have since transacted for a combined <b>$54,629,066</b>.</p>
   <p class="small">Every date, dollar, and owner here comes from primary Metro records: recorded deeds and plats, the cadastral <i>PropInstr</i> tie to each master document, and the parcel genealogy that rebuilds the tracts. No third-party data.</p>

const story=document.getElementById('story');
STEPS.forEach((s,i)=>{const d=document.createElement('section');d.className='step '+(i%2?'right':'left');if(i===0||i===STEPS.length-1)d.className='step center';d.dataset.i=i;d.innerHTML=s.html;story.appendChild(d);});
const rail=document.getElementById('rail');
STEPS.forEach((s,i)=>{const dot=document.createElement('div');dot.className='dot';dot.dataset.i=i;
  dot.onclick=()=>document.querySelectorAll('.step')[i].scrollIntoView({behavior:'smooth'});rail.appendChild(dot);});
const prog=document.getElementById('prog'),hint=document.getElementById('hint');
let cur=-1;
function activate(i){if(i===cur)return;cur=i;const s=STEPS[i];if(s.base)setBase(s.base);if(s.run)s.run();
  prog.style.width=(i/(STEPS.length-1)*100)+'%';hint.style.opacity=i===0?1:0;
  document.querySelectorAll('.rail .dot').forEach(d=>d.classList.toggle('on',+d.dataset.i===i));}
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.5)activate(+e.target.dataset.i);});},{threshold:[.5]});
document.querySelectorAll('.step').forEach(el=>io.observe(el));
activate(0);
