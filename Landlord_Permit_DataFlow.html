<style>
  /* Urban Institute palette: cyan #1696d2, yellow #fdbf11, space gray #5c5859, dark blue #0a4c6a */

<body><div id="wrap">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1240" font-family="'EB Garamond', Garamond, Georgia, serif">
  <rect x="0" y="0" width="1400" height="1240" fill="#ffffff"/>

  <text x="30" y="44" font-size="31" font-weight="bold" fill="#000000">Figure 1: Davidson Landlord Permit Data Flow</text>
  <text x="30" y="76" font-size="17" font-style="italic" fill="#5c5859">ePermits Case (Landlord Registration, caseTypeID 176) joins via caseID to CaseAddress and CasePeople. Both converge on the Cadastral Parcel Layer:</text>
  <text x="30" y="99" font-size="17" font-style="italic" fill="#5c5859">CaseAddress matches by APN, CasePeople by owner name and mailing address. The Cadastral Parcel Layer then feeds the classifier that outputs ParentBrand.</text>

  <rect x="30" y="140" width="655" height="430" fill="#e7f2f8"/>
  <rect x="705" y="140" width="665" height="430" fill="#f2f2f2"/>
  <text x="357" y="172" font-size="18" font-style="italic" font-weight="bold" fill="#5c5859" text-anchor="middle">Spatial join path</text>
  <text x="357" y="193" font-size="13" font-style="italic" fill="#9d9d9d" text-anchor="middle">(APN-based)</text>
  <text x="1037" y="172" font-size="18" font-style="italic" font-weight="bold" fill="#5c5859" text-anchor="middle">Entity join path</text>
  <text x="1037" y="193" font-size="13" font-style="italic" fill="#9d9d9d" text-anchor="middle">(name and mailing address)</text>

  <path d="M600,325 L385,402" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M800,325 L1015,402" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M330,520 L562,596" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1010,520 L838,596" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700,712 L700,828" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700,952 L700,1002" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g font-size="15" font-style="italic" fill="#5c5859">
    <rect x="452" y="350" width="58" height="20" fill="#e7f2f8"/><text x="458" y="365">caseID</text>
    <rect x="898" y="350" width="58" height="20" fill="#f2f2f2"/><text x="904" y="365">caseID</text>
    <rect x="392" y="546" width="90" height="20" fill="#e7f2f8"/><text x="398" y="561">APN match</text>
    <rect x="846" y="546" width="176" height="20" fill="#f2f2f2"/><text x="852" y="561">name + mailing address</text>
    <rect x="625" y="762" width="150" height="20" fill="#ffffff"/><text x="631" y="777">classify and roll up</text>
  </g>

    <text x="700" y="253" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Case  (ePermits OData API)</text>
    <text x="700" y="284" font-size="15" fill="#1a1a1a" text-anchor="middle">caseTypeID = 176   |   Landlord Registration</text>
    <text x="700" y="307" font-size="15" fill="#1a1a1a" text-anchor="middle">30,862 cases   |   2008 to 2026</text>
  </a>

  <a class="node" href="https://epermits.nashville.gov/api/permit/1.0/CaseAddress" target="_blank" rel="noopener">

    <text x="300" y="473" font-size="14" fill="#333" text-anchor="middle">One row per property linked to a case</text>
    <text x="300" y="495" font-size="14" fill="#333" text-anchor="middle">Fields: APN, address</text>
  </a>

  <a class="node" href="https://epermits.nashville.gov/api/permit/1.0/CasePeople" target="_blank" rel="noopener">
    <title>Open the live CasePeople API</title>
    <rect x="850" y="405" width="380" height="115" rx="9" fill="#ffffff" stroke="#1696d2" stroke-width="1.8"/>
    <text x="1040" y="443" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">CasePeople</text>
    <text x="1040" y="473" font-size="14" fill="#333" text-anchor="middle">One row per person linked to a case</text>

  <a class="node" href="https://maps.nashville.gov/arcgis/rest/services/Cadastral/Cadastral_Layers/MapServer/4" target="_blank" rel="noopener">

    <rect x="510" y="600" width="380" height="112" rx="9" fill="#ececec" stroke="#1696d2" stroke-width="2.4"/>
    <text x="700" y="638" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">Cadastral Parcel Layer</text>
    <text x="700" y="668" font-size="14" fill="#1a1a1a" text-anchor="middle">ArcGIS REST   |   MapServer / 4</text>
    <text x="700" y="690" font-size="14" fill="#1a1a1a" text-anchor="middle">285,571 parcels   |   Davidson County</text>
  </a>

  <g><rect x="150" y="830" width="1100" height="122" rx="10" fill="#fff2cf" stroke="#fdbf11" stroke-width="2.2"/>
    <text x="700" y="868" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Institutional Classifier</text>
    <text x="700" y="898" font-size="15" fill="#1a1a1a" text-anchor="middle">80+ regex patterns across 5 categories</text>
    <text x="700" y="920" font-size="15" fill="#1a1a1a" text-anchor="middle">Union-Find aggregation on shared name or shared mailing address</text>
    <text x="700" y="942" font-size="15" fill="#1a1a1a" text-anchor="middle">7,560 unique owners  &#8594;  4,668 corporate sibling groups</text>
  </g>

  <g><rect x="150" y="1002" width="1100" height="150" rx="10" fill="#1696d2" stroke="#12719e" stroke-width="1.8"/>
    <text x="700" y="1040" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">ParentBrand   (classifier output)</text>
    <text x="700" y="1070" font-size="14" fill="#fff" text-anchor="middle">Big 4 SFR REIT:  Progress · American Homes 4 Rent · Amherst · Invitation Homes</text>
    <text x="700" y="1092" font-size="14" fill="#fff" text-anchor="middle">National operators:  FirstKey Homes (Cerberus) · My Community Homes (KKR) · Tricon · VineBrook</text>
    <text x="700" y="1114" font-size="13.5" fill="#fff" text-anchor="middle">Shell-to-parent maps:  YAMASA (Pretium legacy) · Rithm Capital · Bluerock Homes · Homeward (Blackstone) · Conrex / Maymont</text>
    <text x="700" y="1137" font-size="14" font-style="italic" fill="#fff" text-anchor="middle">20,045 corporate-entity Davidson parcels (legacy pre-framework cut)</text>
  </g>

  <text x="30" y="1196" font-size="13.5" font-style="italic" fill="#5c5859">Sources: Metro Nashville ePermits OData API; Nashville Cadastral Layer (MapServer/4); ParentBrand institutional classifier. (last accessed May 15, 2026)</text>
</svg>
