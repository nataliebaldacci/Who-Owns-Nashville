let mode='op',sel=-1,layer=null;function A(){return mode==='op'?{BR:BRO,COL:COLO,ix:2}:{BR:BRU,COL:COLU,ix:3};}
const m=L.map('map',{preferCanvas:true}).setView([36.166,-86.784],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap, &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(m);
fetch('https://nataliebaldacci.github.io/SFR_Nashville/data/Davidson_County_Boundary.geojson').then(r=>r.json()).then(gj=>{L.geoJSON(gj,{style:{color:'#1a3a5c',weight:2,fillOpacity:0,dashArray:'4,4'}}).addTo(m);}).catch(()=>{});
const rndr=L.canvas({padding:.5});
function nearest(e,src){const cp=e.containerPoint;let best=null,bd=16*16;for(const p of src){const q=m.latLngToContainerPoint([p[0],p[1]]);const dx=q.x-cp.x,dy=q.y-cp.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=p;}}if(best)L.popup({maxWidth:370}).setLatLng([best[0],best[1]]).setContent(popup(best)).openOn(m);}
function mk(p,solo){const a=A(),bi=p[a.ix],OTHER=a.BR.length-1;return L.circleMarker([p[0],p[1]],{renderer:rndr,radius:solo?5:4,weight:.4,color:'#fff',fillColor:a.COL[bi],fillOpacity:solo?.95:.85,interactive:false});}
function visible(){const a=A();return PTS.filter(p=>sel<0||p[a.ix]===sel);}
function render(){const a=A(),OTHER=a.BR.length-1;if(layer)m.removeLayer(layer);layer=L.layerGroup();for(const p of visible())mk(p,sel>=0).addTo(layer);layer.addTo(m);
 const cnt=new Array(a.BR.length).fill(0);for(const p of PTS)cnt[p[a.ix]]++;const order=[...a.BR.keys()].sort((x,y)=>(x===OTHER)-(y===OTHER)||cnt[y]-cnt[x]);
 document.getElementById('legendSwatches').innerHTML=order.map(i=>`<div class="sw2 ${sel>=0&&i!==sel?'faded':''}" data-i="${i}"><span class="bar" style="background:${a.COL[i]}"></span><span class="lab">${a.BR[i]}</span><span class="cnt">${cnt[i].toLocaleString()}</span></div>`).join('');
 document.getElementById('status').textContent=(sel>=0?cnt[sel].toLocaleString()+' parcels':PTS.length.toLocaleString()+' institutional parcels');}
document.getElementById('legendSwatches').onclick=e=>{const d=e.target.closest('.sw2');if(!d)return;const i=+d.dataset.i;sel=(sel===i?-1:i);render();};
function setMode(x){mode=x;sel=-1;document.getElementById('mOp').classList.toggle('on',x==='op');document.getElementById('mUp').classList.toggle('on',x==='up');render();}
document.getElementById('mOp').onclick=()=>setMode('op');document.getElementById('mUp').onclick=()=>setMode('up');
m.on('click',e=>nearest(e,visible()));render();</script></body></html>
